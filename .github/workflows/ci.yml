name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres for the tests that exercise money paths end-to-end
    # (OVIGO_DB_TESTS — e.g. tests/test_referral_network.py). Schema comes from the
    # models, not migrations; see that file's docstring for why.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ovigo
          POSTGRES_PASSWORD: ovigo
          POSTGRES_DB: ovigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ovigo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
        env:
          DATABASE_URL: "postgresql+asyncpg://ovigo:ovigo@localhost:5432/ovigo_test"
          SYNC_DATABASE_URL: "postgresql://ovigo:ovigo@localhost:5432/ovigo_test"
          DB_SSL_REQUIRED: "false"
          OVIGO_DB_TESTS: "1"
          ENVIRONMENT: "test"
          JWT_SECRET_KEY: "ci-test-secret"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
